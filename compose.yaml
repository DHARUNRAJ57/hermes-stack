# Hermes + Hindsight. One folder, one compose file, two services.
#
#   hindsight    Shared memory: Hindsight (MCP at /mcp/<bank>/; UI on 127.0.0.1:9999)
#   hermes       Hermes Agent, official image. Its API runs on 127.0.0.1:8642
#
# Memory: Hermes reads and writes Hindsight through MCP (see README.md, step 4).
#
# Start:  docker compose up -d --wait
# Check:  docker compose ps

name: hermes-stack

services:
  # Hindsight: long-term memory. Its LLM is NVIDIA NIM, through Hindsight's
  # OpenAI-compatible provider with NVIDIA's endpoint.
  hindsight:
    image: ${HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight:latest}
    container_name: hermes-hindsight
    restart: unless-stopped
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: https://integrate.api.nvidia.com/v1
      HINDSIGHT_API_LLM_MODEL: nvidia/nemotron-3.5-super-vl-120b-a12b
      HINDSIGHT_API_LLM_API_KEY: ${NVIDIA_API_KEY:?Set NVIDIA_API_KEY in the .env file first}
      # Login for the web UI on port 9999: the sign-in page asks for this shared key.
      HINDSIGHT_CP_ACCESS_KEY: ${HINDSIGHT_CP_ACCESS_KEY:?Set HINDSIGHT_CP_ACCESS_KEY in the .env file first}
    volumes:
      # Memory data (embedded database). Survives `docker compose down` (not `down -v`).
      - hindsight_data:/home/hindsight/.pg0
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: hermes-agent
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      # 0.0.0.0 is needed inside the container so the published port works.
      # The host side is bound to 127.0.0.1 below, so only this PC can reach it.
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in the .env file first}
      # Key for Hermes' "nvidia" provider (NVIDIA NIM). Set it in .env.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      # Web dashboard (open http://127.0.0.1:9119). It requires a login, because it
      # listens on all interfaces inside the container. Set the values in .env.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USERNAME:?Set HERMES_DASHBOARD_USERNAME in the .env file first}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?Set HERMES_DASHBOARD_PASSWORD in the .env file first}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET:?Set HERMES_DASHBOARD_SECRET in the .env file first}
    volumes:
      # Hermes config, sessions, skills and its LLM settings. A Docker volume,
      # not a Windows folder, because SQLite is unsafe on Windows bind mounts.
      - hermes_data:/opt/data
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hindsight_data:
  hermes_data:
